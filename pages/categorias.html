<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias</title>
    <link rel="stylesheet" href="../css/categorias.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>
    <script src="../js/radio.js" defer></script>
    <script src="../js/categorias.js" defer></script>
</head>
<body>
    <main>
       <section class="seccion-crear-categoria">
        <h3 class="titulo-chico">Configuración</h3>
        <h1 class="titulo">Crear nueva categoria</h1>
        <form class="formulario">
            <label for="nombreCategoria">Nombre de la categoria</label>
            <div class="nombre-categoria-texto">
                <input type="text" name="nombreCategoria" class="texto texto-gris" placeholder="Gastos Varios">
                <span class="icono-texto">🏫</span>
            </div>
            <label for="">Seleccione un icono</label>
            <div class="iconos">                
               <label class="label-radio" for="educacion">
                <input type="radio" class="radio-button" name="radios" id="educacion" value="educacion" checked>
                 🏫
               </label>
               <label class="label-radio" for="comida">
               <input type="radio" class="radio-button" name="radios" id="comida" value="comida">
                🛒
               </label>
               <label class="label-radio" for="transporte">
               <input type="radio" class="radio-button" name="radios" id="transporte" value="transporte">
               🚕
              </label>
              <label class="label-radio" for="deporte">
               <input type="radio" class="radio-button" name="radios" id="deporte" value="deporte">
               💪
              </label>
              <label class="label-radio" for="casa">
              <input type="radio" class="radio-button" name="radios" id="casa" value="casa">
               🏠
              </label>
              <label class="label-radio" for="compras">
              <input type="radio" class="radio-button" name="radios" id="compras" value="compras">
               🛍️
              </label>
              <label class="label-radio" for="salidas">
              <input type="radio" class="radio-button" name="radios" id="salidas" value="salidas">
               🍺
              </label>
              <label class="label-radio" for="otrosGastos">
               <input type="radio" class="radio-button" name="radios" id="otrosGastos" value="otrosGastos">
               💸
              </label>
            </div>
            <div class="color-categoria">
                <input type="radio" class="radio-grande radio-color radio-verde" name="radio-color" id="verde" value="verde" checked>
                <input type="radio" class="radio-grande radio-color radio-rojo" name="radio-color" id="rojo" value="rojo">
                <input type="radio" class="radio-grande radio-color radio-gris" name="radio-color" id="gris" value="gris">
                <input type="radio" class="radio-grande radio-color radio-celeste" name="radio-color" id="celeste" value="celeste">
                <input type="radio" class="radio-grande radio-color radio-azul" name="radio-color" id="azul" value="azul">
                <input type="radio" class="radio-grande radio-color radio-violeta" name="radio-color" id="violeta" value="violeta">
            </div>
            <button class="btn btn-m btn-naranja" type="button" onclick="agregarCategoria()">Crear Categoria</button>
        </form>
       </section>
       <section class="resumen-categorias">
        <h3 class="titulo-chico">Resumen</h3>
        <h1 class="titulo">Categorias Actuales</h1>
        <h4 class="subtitulo">5 categorias cargadas</h4>
        <div class="categorias">
           <ul class="lista-categorias">
            
           </ul>
        </div>

       </section>


    </main>
</body>
</html>
