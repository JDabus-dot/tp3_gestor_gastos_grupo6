<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Gastos</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel ="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/favicon/favicon.ico">
    
</head>

<body>
    <header class="header">
        <h1>Gestor de Gastos Personales</h1>
    </header>
    
    <main class="container">
        
        <section class="seccion-formulario">
            <h2>Nuevo gasto</h2>
            <form id="formulario-gasto">
                <div class="formulario">
                    <label for="nombre">Concepto</label>
                    <input type="text" id="nombre" name="concepto">
                </div>

                <div class="formulario">
                    <label for="monto">Monto</label>
                    <input type="number" id="monto" name="monto">
                </div>

                <div class="formulario">
                    <label for="categoria">Categoría</label>
                    <select id="categoria" name="categoria">
                        <option value="">Seleccionar</option>
                        <option value="comida">Comida</option>
                        <option value="transporte">Transporte</option>
                        <option value="servicios">Servicios</option>
                        <option value="deporte">Deporte</option>
                        <option value="ocio">Ocio</option>
                    </select>
                </div>

                <div class="formulario">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" name="fecha">
                </div>

                <button type="submit" class="btn-primary">Agregar</button>

            </form>
        </section>
        
        <section class="seccion-lista">
            <h2>Registro de Transacciones</h2>
            <ul id="lista-gastos">

            </ul>
        </section>
        
        <aside class="seccion-resumen">
            <h2>Balance Total</h2>
            <div class="resumen-card">
                <span id="total">$0</span>
            </div>
            <div class="resumen-card">
                <p>Gastos registrados</p>
                <span id="cantidad">0</span>
            </div>
        </aside>
    </main>
    
    <script src="js/formulario.js"></script>
</body>
</html>
